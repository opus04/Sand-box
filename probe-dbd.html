<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DBD 390px probe</title>
<style>
  body{margin:0;background:#0b0910;color:#eee;font:12px/1.5 monospace;display:flex;gap:12px;align-items:flex-start;padding:8px}
  iframe{border:1px solid #333;background:#000;flex:0 0 auto}
  pre{position:fixed;right:8px;bottom:8px;max-width:520px;max-height:420px;overflow:auto;background:#000d;padding:8px;margin:0;white-space:pre-wrap;z-index:9}
</style>
</head>
<body>
<iframe id="f390" src="./index.html?probe=390" width="390" height="844"></iframe>
<iframe id="f620" src="./index.html?probe=620" width="620" height="700"></iframe>
<pre id="out">measuring…</pre>
<script>
var log = [];
function say(s){ log.push(s); document.getElementById('out').textContent = log.join('\n'); }
function wait(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

async function measure(id, label){
  var f = document.getElementById(id);
  var w = f.contentWindow, d = f.contentDocument;
  try{
    for(var i = 0; i < 40; i++){ if(d.getElementById('enterBtn')) break; await wait(150); }
    d.getElementById('enterBtn').click();
    await wait(900);
    var head = d.querySelector('.panel[data-name="GAMING"] .p-head');
    if(!head) throw new Error('no gaming head');
    head.click();
    await wait(900);
    var tab = d.querySelector('[data-gm="dbd"]');
    if(!tab) throw new Error('no dbd tab');
    tab.click();
    for(var j = 0; j < 40; j++){ if(d.querySelectorAll('#dbdList .dbd-row').length) break; await wait(200); }
    await wait(500);

    var sw = d.documentElement.scrollWidth, iw = w.innerWidth;
    var body = d.body.scrollWidth;
    var panel = d.getElementById('dbdPanel');
    var wrap = d.querySelector('.view-body');
    var hl = d.getElementById('dbdHl');
    var active = d.activeElement ? (d.activeElement.id || d.activeElement.tagName) : '';
    say('[' + label + '] inner=' + iw + ' docScroll=' + sw + ' bodyScroll=' + body +
        ' overflow=' + (sw - iw) +
        ' | panel ' + panel.scrollWidth + '/' + panel.clientWidth +
        ' | viewBody ' + wrap.scrollWidth + '/' + wrap.clientWidth +
        ' | hl ' + hl.scrollWidth + '/' + hl.clientWidth +
        ' | rows=' + d.querySelectorAll('#dbdList .dbd-row').length +
        ' emblems=' + d.querySelectorAll('#dbdHl .dbd-em').length +
        ' | dbdVisible=' + !panel.hidden +
        ' lolHidden=' + d.getElementById('lmPanel').hidden +
        ' | meta="' + d.getElementById('dbdMeta').textContent.replace(/\s+/g,' ') + '"');
    var overflowEls = [];
    ['.gm-switch','.dbd','.dbd-hl','.dbd-row','.dbd-top','.dbd-sub','.dbd-perks'].forEach(function(sel){
      d.querySelectorAll(sel).forEach(function(e, i){
        if(e.scrollWidth > e.clientWidth + 1){ overflowEls.push(sel + '#' + i + ' ' + e.scrollWidth + '>' + e.clientWidth); }
      });
    });
    say('[' + label + '] inner overflow elements: ' + (overflowEls.length ? overflowEls.join(', ') : 'none'));

    // LoL 복귀
    d.querySelector('[data-gm="lol"]').click();
    await wait(600);
    say('[' + label + '] back to LoL → lmVisible=' + !d.getElementById('lmPanel').hidden +
        ' dbdHidden=' + d.getElementById('dbdPanel').hidden +
        ' lmRows=' + d.querySelectorAll('#lmList .lm-row').length);

    // 다시 DBD
    d.querySelector('[data-gm="dbd"]').click();
    await wait(400);
    say('[' + label + '] DBD again → dbdVisible=' + !d.getElementById('dbdPanel').hidden +
        ' count=' + d.getElementById('dbdCount').textContent +
        ' auto="' + d.getElementById('dbdAutoTxt').textContent.trim() + '"' +
        ' upd="' + d.getElementById('dbdUpd').textContent + '"');
  }catch(e){
    say('[' + label + '] ERROR ' + e.message);
  }
}

(async function(){
  await measure('f390', '390px');
  await measure('f620', '620px');
  say('done');
})();
</script>
</body>
</html>
