<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>layout probe</title>
<style>
  html,body{margin:0;background:#0a0a0c;color:#ddd;font:12px/1.4 monospace}
  .row{display:flex;gap:8px;align-items:flex-start}
  iframe{border:0;background:#000;display:block}
  body{overflow-x:hidden}
  #out{margin:8px 0 0;padding:6px 8px;background:rgba(0,0,0,.85);color:#b6ffd9;white-space:pre-wrap;max-width:100%;font-size:11px}
</style>
</head>
<body>
<div class="row">
  <iframe id="f1440" width="1440" height="900" title="probe1440"></iframe>
  <iframe id="f390" width="390" height="844" title="probe390"></iframe>
</div>
<pre id="out">loading</pre>
<script>
var results = {};
var HOOK = '<script>window.__err=[];' +
  'window.addEventListener("error",function(e){var t=e.target;' +
  'if(t&&t.tagName&&(t.src||t.href)){window.__err.push("resource: "+t.tagName+" "+(t.src||t.href));}' +
  'else{window.__err.push("error: "+(e.message||"")+" @ "+((e.filename||"").split("/").pop())+":"+e.lineno);}},true);' +
  'window.addEventListener("unhandledrejection",function(e){window.__err.push("rejection: "+((e.reason&&e.reason.message)||e.reason));});' +
  '(function(){var ce=console.error,cw=console.warn;' +
  'console.error=function(){window.__err.push("console.error: "+Array.prototype.slice.call(arguments).join(" "));ce.apply(console,arguments);};' +
  'console.warn=function(){window.__err.push("console.warn: "+Array.prototype.slice.call(arguments).join(" "));cw.apply(console,arguments);};})();' +
  '<\/script>';

function box(el){ if(!el) return null; var b=el.getBoundingClientRect(); return {top:Math.round(b.top), left:Math.round(b.left), w:Math.round(b.width), h:Math.round(b.height)}; }

function probe(id){
  var f = document.getElementById(id);
  var doc = f.contentDocument, win = f.contentWindow, de = doc.documentElement;
  var res = {};
  try{
    var lm = doc.getElementById('lmPanel');
    var hl = doc.getElementById('lmHl');
    var list = doc.getElementById('lmList');
    var pv = doc.querySelector('.panel[data-name="GAMING"] .p-preview');
    var live = doc.getElementById('gmLive');
    res.w = win.innerWidth;
    res.errors = win.__err || 'hook missing';
    res.overflowX = de.scrollWidth - de.clientWidth;
    res.docScrollW = de.scrollWidth;
    res.docClientW = de.clientWidth;
    res.hub_overall_overflowX = results[id + '_hub'] ? results[id + '_hub'].overflowX : null;
    res.hub = results[id + '_hub'] || null;
    res.hlHidden = hl ? hl.hidden : 'missing';
    res.hlBox = box(hl);
    res.hlScrollW = hl ? hl.scrollWidth : null;
    res.hlClientW = hl ? hl.clientWidth : null;
    res.listTop = list ? Math.round(list.getBoundingClientRect().top + win.scrollY) : null;
    res.hlTopAbs = hl ? Math.round(hl.getBoundingClientRect().top + win.scrollY) : null;
    res.lmScrollW = lm ? lm.scrollWidth : null;
    res.lmClientW = lm ? lm.clientWidth : null;
    res.preview = pv ? {sw: pv.scrollWidth, cw: pv.clientWidth, h: Math.round(pv.getBoundingClientRect().height)} : null;
    res.rows = doc.querySelectorAll('#lmList .lm-row').length;
    res.state = lm ? lm.getAttribute('data-lm') : null;
    res.hlText = hl ? hl.innerText.replace(/\s+/g, ' ').slice(0, 120) : null;
    res.time = de.getAttribute('data-time');
    var tile = doc.querySelector('.tile');
    res.tileStyle = tile ? (function(){ var cs = win.getComputedStyle(tile); return {opacity: cs.opacity, bg: cs.backgroundColor, filter: cs.filter}; })() : null;
    var view = doc.getElementById('v02');
    res.viewStyle = view ? (function(){ var cs = win.getComputedStyle(view); return {opacity: cs.opacity, transform: cs.transform, overflowY: cs.overflowY}; })() : null;
  }catch(e){ res.error = String(e); }
  results[id] = res;
  document.getElementById('out').textContent = JSON.stringify(results, null, 1);
  try{
    var lmEl = doc.getElementById('lmPanel');
    if(lmEl){ lmEl.scrollIntoView({block: 'start', behavior: 'instant'}); }
  }catch(e2){}
}

function hubProbe(id){
  var f = document.getElementById(id);
  var doc = f.contentDocument, win = f.contentWindow, de = doc.documentElement;
  var pv = doc.querySelector('.panel[data-name="GAMING"] .p-preview');
  var live = doc.getElementById('gmLive');
  var panel = doc.querySelector('.panel[data-name="GAMING"]');
  results[id + '_hub'] = {
    overflowX: de.scrollWidth - de.clientWidth,
    preview: pv ? {sw: pv.scrollWidth, cw: pv.clientWidth, h: Math.round(pv.getBoundingClientRect().height)} : null,
    panelH: panel ? Math.round(panel.getBoundingClientRect().height) : null,
    live: live ? {hidden: live.hidden, sw: live.scrollWidth, cw: live.clientWidth, h: Math.round(live.getBoundingClientRect().height), text: live.innerText.replace(/\s+/g, ' ').slice(0, 90)} : 'missing'
  };
}

function boot(id){
  var f = document.getElementById(id), doc = f.contentDocument;
  var btn = doc.getElementById('enterBtn');
  if(btn){ btn.click(); }
  setTimeout(function(){
    try{ hubProbe(id); }catch(e){ results[id + '_hub'] = {error:String(e)}; }
    var head = doc.querySelector('.panel[data-name="GAMING"] .p-head');
    if(head){ head.click(); }
    setTimeout(function(){ probe(id); }, 1500);
  }, 900);
}

fetch('index.html', {cache: 'no-store'}).then(function(r){ return r.text(); }).then(function(html){
  var page = html.replace('<head>', '<head>' + HOOK);
  ['f1440', 'f390'].forEach(function(id){
    var f = document.getElementById(id);
    f.srcdoc = page;
    f.onload = function(){ boot(id); };
  });
}).catch(function(e){
  document.getElementById('out').textContent = 'fetch failed: ' + e;
});
</script>
</body>
</html>
