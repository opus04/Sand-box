<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>layout probe</title>
<style>
  html,body{margin:0;background:#0a0a0c;color:#ddd;font:12px/1.4 monospace}
  iframe{border:0;background:#000;display:block}
  #out{margin:8px 0 0;padding:6px 8px;background:rgba(0,0,0,.9);color:#b6ffd9;white-space:pre-wrap;max-width:100%;font-size:11px}
</style>
</head>
<body>
<iframe id="f" title="probe"></iframe>
<pre id="out">loading</pre>
<script>
var q = new URLSearchParams(location.search);
var W = parseInt(q.get('w') || '1440', 10);
var H = W <= 500 ? 844 : 900;
var results = {};
var HOOK = '<script>window.__err=[];' +
  'window.addEventListener("error",function(e){var t=e.target;' +
  'if(t&&t.tagName&&(t.src||t.href)){window.__err.push("resource: "+t.tagName+" "+(t.src||t.href));}' +
  'else{window.__err.push("error: "+(e.message||"")+" @ "+((e.filename||"").split("/").pop())+":"+e.lineno);}},true);' +
  'window.addEventListener("unhandledrejection",function(e){window.__err.push("rejection: "+((e.reason&&e.reason.message)||e.reason));});' +
  '(function(){var ce=console.error,cw=console.warn;' +
  'console.error=function(){window.__err.push("console.error: "+Array.prototype.slice.call(arguments).join(" "));ce.apply(console,arguments);};' +
  'console.warn=function(){window.__err.push("console.warn: "+Array.prototype.slice.call(arguments).join(" "));cw.apply(console,arguments);};})();' +
  '<\/script>';

function box(el){ if(!el) return null; var b = el.getBoundingClientRect(); return {top: Math.round(b.top), left: Math.round(b.left), w: Math.round(b.width), h: Math.round(b.height)}; }

var f = document.getElementById('f');
f.width = W; f.height = H;

function measure(){
  var doc = f.contentDocument, win = f.contentWindow, de = doc.documentElement;
  var lm = doc.getElementById('lmPanel'), hl = doc.getElementById('lmHl'), list = doc.getElementById('lmList');
  var pv = doc.querySelector('.panel[data-name="GAMING"] .p-preview'), live = doc.getElementById('gmLive');
  var view = doc.getElementById('v02');
  results = {
    w: win.innerWidth, h: win.innerHeight,
    errors: win.__err || 'hook missing',
    time: de.getAttribute('data-time'),
    overflowX_sectionView: de.scrollWidth - de.clientWidth,
    docScrollW: de.scrollWidth, docClientW: de.clientWidth,
    hub: results.hub || null,
    hlHidden: hl ? hl.hidden : 'missing',
    hlBox: box(hl), hlScrollW: hl ? hl.scrollWidth : null, hlClientW: hl ? hl.clientWidth : null,
    listTopAbs: list ? Math.round(list.getBoundingClientRect().top + win.scrollY) : null,
    hlTopAbs: hl ? Math.round(hl.getBoundingClientRect().top + win.scrollY) : null,
    lmScrollW: lm ? lm.scrollWidth : null, lmClientW: lm ? lm.clientWidth : null,
    rows: doc.querySelectorAll('#lmList .lm-row').length,
    state: lm ? lm.getAttribute('data-lm') : null,
    hlText: hl ? hl.innerText.replace(/\s+/g, ' ').slice(0, 110) : null,
    viewOpacity: view ? win.getComputedStyle(view).opacity : null
  };
  document.getElementById('out').textContent = JSON.stringify(results, null, 1);
  try{ if(lm){ lm.scrollIntoView({block: 'start', behavior: 'instant'}); } }catch(e){}
}

function hubMeasure(){
  var doc = f.contentDocument, de = doc.documentElement;
  var pv = doc.querySelector('.panel[data-name="GAMING"] .p-preview'), live = doc.getElementById('gmLive');
  var panel = doc.querySelector('.panel[data-name="GAMING"]');
  results.hub = {
    overflowX: de.scrollWidth - de.clientWidth,
    preview: pv ? {sw: pv.scrollWidth, cw: pv.clientWidth, h: Math.round(pv.getBoundingClientRect().height)} : null,
    panelH: panel ? Math.round(panel.getBoundingClientRect().height) : null,
    live: live ? {hidden: live.hidden, sw: live.scrollWidth, cw: live.clientWidth, h: Math.round(live.getBoundingClientRect().height), text: live.innerText.replace(/\s+/g, ' ').slice(0, 90)} : 'missing'
  };
}

fetch('index.html', {cache: 'no-store'}).then(function(r){ return r.text(); }).then(function(html){
  f.srcdoc = html.replace('<head>', '<head>' + HOOK);
  f.onload = function(){
    var doc = f.contentDocument;
    var btn = doc.getElementById('enterBtn');
    if(btn){ btn.click(); }
    setTimeout(function(){
      try{ hubMeasure(); }catch(e){ results.hub = {error: String(e)}; }
      var head = doc.querySelector('.panel[data-name="GAMING"] .p-head');
      if(head){ head.click(); }
      setTimeout(measure, 1600);
    }, 1000);
  };
}).catch(function(e){ document.getElementById('out').textContent = 'fetch failed: ' + e; });
</script>
</body>
</html>
