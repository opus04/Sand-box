<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>probe</title>
<style>
  html,body{margin:0;background:#111;color:#eee;font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  #wrap{position:relative}
  iframe{border:0;display:block;background:#000}
  #report{position:fixed;right:8px;bottom:8px;width:520px;max-height:70vh;overflow:auto;background:rgba(0,0,0,.86);
          border:1px solid #444;border-radius:8px;padding:10px 12px;font:11.5px/1.45 ui-monospace,Menlo,monospace;white-space:pre-wrap;z-index:9}
</style>
</head>
<body>
<div id="wrap"></div>
<pre id="report">loading…</pre>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var w = parseInt(q.get('w') || '1440', 10);
  var sec = parseInt(q.get('sec') || '1', 10);
  var h = w <= 700 ? 844 : 900;
  var wrap = document.getElementById('wrap');
  var rep = document.getElementById('report');
  var rows = [];

  var fr = document.createElement('iframe');
  fr.width = w; fr.height = h;
  fr.src = 'index.html?probe=' + Date.now();
  wrap.appendChild(fr);

  function out(){
    rep.textContent = rows.join('\n');
    document.title = 'probe ' + w + ' sec' + sec;
  }

  fr.addEventListener('load', function(){
    var d = fr.contentDocument, win = fr.contentWindow;
    var errs = [];
    win.addEventListener('error', function(e){ errs.push(String(e.message)); });
    win.addEventListener('unhandledrejection', function(e){ errs.push('reject:' + e.reason); });

    setTimeout(function(){
      var enter = d.getElementById('enterBtn');
      if(enter){ enter.click(); }
      setTimeout(function(){
        var panels = d.querySelectorAll('.panel');
        if(panels[sec-1]){ panels[sec-1].click(); }
        setTimeout(function(){
          var de = d.documentElement;
          var fx = d.querySelector('.vfx-holder') || d.querySelector('.v-fx');
          var animated = 0, sample = [];
          d.querySelectorAll('.v-fx *').forEach(function(el){
            var cs = win.getComputedStyle(el);
            if(cs.animationName && cs.animationName !== 'none'){
              animated++;
              if(sample.length < 6){ sample.push(el.getAttribute('class') + '=' + cs.animationName + '/' + cs.animationDuration); }
            }
          });
          var vbg = Array.prototype.filter.call(d.querySelectorAll('.vbg'), function(v){
            return win.getComputedStyle(v).display !== 'none';
          })[0];
          var art = vbg ? vbg.querySelector('.v-art') : null;
          var fxEl = vbg ? vbg.querySelector('.v-fx') : null;
          var ab = art ? art.getBoundingClientRect() : null;
          var fb = fxEl ? fxEl.getBoundingClientRect() : null;
          var lite = d.querySelector('html');
          lite.classList.add('lite');
          var liteDisplay = fxEl ? win.getComputedStyle(fxEl).display : 'n/a';
          lite.classList.remove('lite');

          rows.push('WIDTH ' + win.innerWidth + ' / viewport h ' + win.innerHeight);
          rows.push('scrollWidth ' + de.scrollWidth + ' clientWidth ' + de.clientWidth +
                    ' → overflowX ' + (de.scrollWidth > de.clientWidth ? 'YES ' + (de.scrollWidth - de.clientWidth) + 'px' : '0'));
          rows.push('body scrollWidth ' + d.body.scrollWidth);
          rows.push('view=' + d.body.getAttribute('data-view') + '  vbg shown=' + (fxEl ? 'yes' : 'no'));
          rows.push('v-fx layers ' + d.querySelectorAll('.v-fx').length + '  animated nodes ' + animated);
          rows.push('anim sample: ' + sample.join(' | '));
          if(ab && fb){
            rows.push('art box  ' + Math.round(ab.left) + ',' + Math.round(ab.top) + ' ' + Math.round(ab.width) + 'x' + Math.round(ab.height));
            rows.push('fx  box  ' + Math.round(fb.left) + ',' + Math.round(fb.top) + ' ' + Math.round(fb.width) + 'x' + Math.round(fb.height));
            rows.push('aligned  ' + (Math.abs(ab.left - fb.left) < 1.5 && Math.abs(ab.width - fb.width) < 1.5 && Math.abs(ab.top - fb.top) < 1.5 ? 'YES' : 'NO'));
          }
          rows.push('lite → .v-fx display ' + liteDisplay);
          rows.push('errors ' + errs.length + ' ' + errs.join('; '));
          out();
        }, 900);
      }, 500);
    }, 700);
  });
  out();
})();
</script>
</body>
</html>
