<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0f19">
<meta name="description" content="비 오는 밤, 카페 창가에서 쓰는 작은 허브. 시계와 오늘의 운세, 검색, 메모, 빗소리.">
<title>비 오는 밤의 창가</title>
<style>
  :root{
    --serif: "Noto Serif KR", "Noto Serif CJK KR", "Nanum Myeongjo", "Apple SD Gothic Neo", Georgia, "Times New Roman", serif;
    --sans: "Pretendard", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    --cream: #f7ebdb;
    --muted: #d3bda6;
    --amber: #f2b273;
    --amber-deep: #c9823f;
    --line: rgba(255, 200, 150, .17);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    min-height:100vh;min-height:100dvh;
    font-family:var(--sans);color:var(--cream);
    background:
      radial-gradient(80% 34% at 50% 60%, rgba(255,168,92,.10), transparent 70%),
      linear-gradient(180deg, #241609 0%, #1b100a 30%, #150d08 62%, #100906 100%);
    overflow-x:hidden;-webkit-font-smoothing:antialiased;
  }
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

  /* ================= window scene ================= */
  .scene{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:#070b13}
  .sky{position:absolute;inset:0;
    background:
      radial-gradient(120% 62% at 50% 4%, #22304a 0%, #16203400 55%),
      radial-gradient(90% 50% at 18% 34%, rgba(255,150,80,.16), transparent 68%),
      radial-gradient(70% 44% at 84% 30%, rgba(255,170,100,.10), transparent 70%),
      linear-gradient(180deg,#0b1322 0%,#101a2c 42%,#16202f 72%,#0c1420 100%);}
  .haze{position:absolute;inset:0;
    background:radial-gradient(58% 40% at 50% 88%, rgba(255,158,84,.22), rgba(255,158,84,.06) 48%, transparent 74%);
    filter:blur(10px);mix-blend-mode:screen}
  #skyline{position:absolute;inset:0;width:100%;height:100%;display:block}
  #rain{position:absolute;inset:0;width:100%;height:100%;display:block}
  .bokeh{position:absolute;inset:0;overflow:hidden;mix-blend-mode:screen}
  .bokeh i{position:absolute;display:block;border-radius:50%;
    filter:blur(var(--blur,12px));opacity:var(--op,.5);
    animation:sway var(--dur,14s) ease-in-out var(--delay,0s) infinite alternate;
    will-change:transform,opacity}
  @keyframes sway{0%{transform:translate3d(0,0,0) scale(1)}100%{transform:translate3d(var(--dx,6px),var(--dy,-8px),0) scale(1.08)}}
  .mist{position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(64% 30% at 50% 72%, rgba(140,175,215,.10), transparent 70%),
      radial-gradient(50% 26% at 12% 84%, rgba(255,176,104,.16), transparent 72%),
      radial-gradient(46% 24% at 90% 82%, rgba(255,186,120,.12), transparent 74%);
    mix-blend-mode:screen}
  .aviation{animation:avi 3.4s ease-in-out infinite}
  @keyframes avi{0%,100%{opacity:.25}46%,54%{opacity:1}}
  .drops{position:absolute;inset:0;overflow:hidden}
  .sheen{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;
    background:
      linear-gradient(118deg, rgba(190,215,255,.05) 0%, rgba(190,215,255,0) 26%, rgba(255,220,180,.045) 52%, rgba(190,215,255,0) 74%);}
  .drop{position:absolute;top:-12%;left:var(--x);
    width:var(--s,8px);height:calc(var(--s,8px) * 1.18);
    border-radius:52% 52% 48% 48% / 46% 46% 54% 54%;
    background:
      radial-gradient(circle at 42% 82%, rgba(255,255,255,.55), rgba(220,238,255,.12) 34%, rgba(160,195,235,.02) 62%, rgba(140,175,220,0) 78%),
      radial-gradient(circle at 66% 30%, rgba(255,255,255,.22), rgba(200,225,255,.05) 40%, rgba(140,175,220,0) 66%);
    box-shadow:inset 0 -1px 1.5px rgba(255,255,255,.55), inset 0 1.5px 2px rgba(60,95,140,.45), 0 1px 4px rgba(0,0,0,.25);
    animation:slide var(--d,16s) linear var(--delay,0s) infinite;
    will-change:transform}
  .drop::after{content:"";position:absolute;left:46%;bottom:74%;
    width:1.6px;height:calc(var(--s,10px) * 7);
    border-radius:2px;
    background:linear-gradient(to top, rgba(205,225,255,.30), rgba(205,225,255,0));
    animation:trail var(--d,16s) linear var(--delay,0s) infinite;transform-origin:bottom center}
  @keyframes slide{
    0%{transform:translate(0,-16vh) scaleY(.86)}
    12%{transform:translate(0,2vh) scaleY(1)}
    34%{transform:translate(calc(var(--wob,7px) * .5), 26vh)}
    37%{transform:translate(calc(var(--wob,7px) * .5), 26vh) scaleY(.93)}
    42%{transform:translate(calc(var(--wob,7px) * .95), 28vh) scaleY(1.05)}
    72%{transform:translate(var(--wob,7px), 64vh)}
    100%{transform:translate(calc(var(--wob,7px) * 1.15), 120vh)}
  }
  @keyframes trail{0%,10%{opacity:0}20%{opacity:.75}84%{opacity:.4}100%{opacity:0}}

  /* ================= frame ================= */
  .frame{position:fixed;inset:0;z-index:6;pointer-events:none}
  .frame .bar{position:absolute;
    background:linear-gradient(90deg,#241609 0%,#402a18 16%,#6b4527 46%,#3f2818 76%,#201309 100%);
    box-shadow:0 0 24px rgba(0,0,0,.6), inset 0 0 16px rgba(0,0,0,.4)}
  .frame .bar::after{content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(92deg, rgba(255,210,160,.05) 0 2px, transparent 2px 9px)}
  .frame .top{left:0;right:0;top:0;height:12px}
  .frame .left{top:0;bottom:0;left:0;width:12px}
  .frame .right{top:0;bottom:0;right:0;width:12px}
  .frame .mull{position:absolute;top:0;bottom:44vh;width:10px;
    background:linear-gradient(90deg,#251608,#563a22 38%,#7b5330 52%,#3a2413);
    box-shadow:0 0 18px rgba(0,0,0,.55), inset 0 0 8px rgba(0,0,0,.45);opacity:.9}
  .frame .mull.v1{left:23%}
  .frame .mull.v2{right:23%}
  .frame .mull.h1{top:auto;bottom:calc(44vh - 11px);left:0;right:0;height:11px;width:auto;opacity:1}
  .sill{position:fixed;left:0;right:0;z-index:7;bottom:44vh;height:13px;pointer-events:none;
    background:linear-gradient(180deg,#8f6136 0%,#5d3a21 38%,#2a1a10 100%);
    box-shadow:0 10px 30px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,214,170,.45)}

  /* ================= pendant lamps ================= */
  .lamps{position:fixed;inset:0;z-index:5;pointer-events:none}
  .lamp{position:absolute;top:0;width:2px}
  .lamp::before{content:"";position:absolute;left:0;top:0;width:100%;height:var(--drop,96px);
    background:linear-gradient(180deg,rgba(18,12,8,.95),rgba(96,66,42,.85))}
  .lamp .shade{position:absolute;left:50%;top:var(--drop,96px);transform:translateX(-50%);
    width:72px;height:38px;border-radius:50% 50% 44% 44% / 20% 20% 80% 80%;
    background:linear-gradient(180deg,#3a2718 0%,#6b4526 34%,#c99253 86%,#f8d29a 100%);
    box-shadow:0 10px 32px rgba(0,0,0,.6), inset 0 -6px 12px rgba(255,208,152,.45)}
  .lamp .bulb{position:absolute;left:50%;top:calc(var(--drop,96px) + 32px);transform:translateX(-50%);
    width:14px;height:11px;border-radius:50%;
    background:radial-gradient(circle,#ffdfae 0%,#ffb46a 55%,rgba(255,160,80,0) 74%);
    box-shadow:0 0 30px 12px rgba(255,176,96,.28), 0 0 86px 42px rgba(255,150,70,.13)}
  .lamp--l{left:12%}
  .lamp--r{right:12%}

  /* ================= table ================= */
  .table{position:fixed;left:0;right:0;bottom:0;height:44vh;z-index:7;pointer-events:none;
    background:
      radial-gradient(70% 90% at 50% -6%, rgba(255,182,108,.22), rgba(255,166,92,.06) 46%, transparent 68%),
      radial-gradient(40% 60% at 82% 10%, rgba(255,180,110,.10), transparent 70%),
      linear-gradient(180deg,#48301d 0%,#33200f 14%,#22150c 44%,#180f09 74%,#110a06 100%);
    box-shadow:inset 0 30px 60px -30px rgba(0,0,0,.95)}
  .table::before{content:"";position:absolute;inset:0;opacity:.4;
    background:
      repeating-linear-gradient(87deg, rgba(255,205,160,.05) 0 1px, transparent 1px 9px),
      repeating-linear-gradient(3deg, rgba(0,0,0,.22) 0 2px, transparent 2px 34px)}
  .table::after{content:"";position:absolute;left:0;right:0;top:0;height:96px;
    background:
      linear-gradient(90deg,transparent,rgba(255,218,175,.55) 50%,transparent) top/100% 1px no-repeat,
      radial-gradient(46% 100% at 50% 0%, rgba(255,196,132,.16), transparent 72%)}

  /* coffee cup */
    .cup{position:fixed;left:max(2px, calc(50% - 712px));bottom:calc(44vh - 120px);z-index:8;width:176px;pointer-events:none;
    filter:drop-shadow(0 22px 24px rgba(0,0,0,.6))}
  .cup svg{display:block;width:100%;height:auto;overflow:visible}
  .steam path{stroke:rgba(255,238,216,.62);stroke-width:2;fill:none;stroke-linecap:round;
    animation:steam 6s ease-in-out infinite}
  .steam path:nth-child(2){animation-delay:1.4s;opacity:.75}
  .steam path:nth-child(3){animation-delay:2.9s;opacity:.55}
  @keyframes steam{
    0%{transform:translateY(8px) scaleY(.9);opacity:0}
    30%{opacity:.6}
    72%{opacity:.3}
    100%{transform:translateY(-22px) scaleY(1.06);opacity:0}
  }

  /* candle */
  .candle{position:fixed;right:max(6px, calc(50% - 700px));bottom:calc(44vh - 96px);z-index:8;width:104px;pointer-events:none;
    filter:drop-shadow(0 16px 18px rgba(0,0,0,.6))}
  .candle svg{display:block;width:100%;height:auto;overflow:visible}
  .flame{transform-origin:50% 82%;animation:flicker 3.2s ease-in-out infinite}
  @keyframes flicker{0%,100%{transform:scale(1) rotate(0)}35%{transform:scale(1.06,.96) rotate(1.4deg)}62%{transform:scale(.95,1.05) rotate(-1.2deg)}80%{transform:scale(1.03,.98) rotate(.6deg)}}

  /* ================= top pills ================= */
  .brand{position:fixed;top:26px;left:26px;z-index:12;display:flex;align-items:center;gap:9px;
    font-family:var(--serif);font-size:13px;letter-spacing:.2em;color:rgba(247,235,219,.92);
    text-shadow:0 2px 16px rgba(0,0,0,.8)}
  .brand .dot{width:5px;height:5px;border-radius:50%;background:var(--amber);box-shadow:0 0 10px 2px rgba(242,178,115,.65)}
  .sound{position:fixed;top:19px;right:23px;z-index:14;display:inline-flex;align-items:center;gap:10px;
    padding:9px 14px;border-radius:999px;
    background:rgba(24,15,10,.6);border:1px solid rgba(255,196,140,.2);
    color:var(--cream);font-family:var(--sans);font-size:12.5px;
    backdrop-filter:blur(12px) saturate(120%);cursor:pointer;
    transition:background .25s,border-color .25s,transform .2s;
    box-shadow:0 12px 28px -16px rgba(0,0,0,.95)}
  .sound:hover{background:rgba(46,29,18,.72);border-color:rgba(255,196,140,.42)}
  .sound:active{transform:scale(.98)}
  .sound svg{width:16px;height:16px;flex:none;opacity:.85}
  .sw{position:relative;width:34px;height:19px;border-radius:999px;background:rgba(255,235,215,.13);
    border:1px solid rgba(255,220,180,.22);transition:background .25s,border-color .25s;flex:none}
  .sw::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;
    background:#e6d2bb;transition:transform .25s cubic-bezier(.4,.1,.2,1),background .25s}
  .sound[aria-pressed="true"] .sw{background:rgba(242,178,115,.34);border-color:rgba(242,178,115,.72)}
  .sound[aria-pressed="true"] .sw::after{transform:translateX(15px);background:#ffd6a5}
  .sound .eq{display:inline-flex;align-items:flex-end;gap:2px;height:11px;opacity:0;transition:opacity .3s}
  .sound .eq i{width:2px;background:var(--amber);border-radius:2px;height:4px;animation:eq 1.1s ease-in-out infinite}
  .sound .eq i:nth-child(2){animation-delay:.18s}
  .sound .eq i:nth-child(3){animation-delay:.36s}
  .sound[aria-pressed="true"] .eq{opacity:.9}
  @keyframes eq{0%,100%{height:3px}50%{height:10px}}

  /* ================= content ================= */
  main{position:relative;z-index:10;padding:0 20px 34px}
  .hero{position:relative;display:flex;flex-direction:column;align-items:center;gap:9px;
    padding-top:30px;text-align:center;isolation:isolate}
  .hero::before{content:"";position:absolute;left:50%;top:-60px;transform:translateX(-50%);
    width:min(900px,100vw);height:360px;z-index:-1;
    background:radial-gradient(48% 58% at 50% 46%, rgba(5,9,17,.66), rgba(5,9,17,.30) 56%, transparent 78%);
    filter:blur(4px)}
  .fortune{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;
    max-width:min(760px,94vw);padding:8px 17px;border-radius:999px;
    background:rgba(18,12,9,.52);border:1px solid rgba(255,196,140,.24);
    backdrop-filter:blur(10px) saturate(115%);
    box-shadow:0 14px 30px -22px rgba(0,0,0,.95)}
  .f-label{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.18em;
    color:#f6c088;font-weight:700;white-space:nowrap}
  .f-label svg{width:11px;height:11px}
  #fortuneText{margin:0;font-size:13.5px;line-height:1.5;color:#f0dfca;transition:opacity .5s}
  .clock{display:flex;align-items:baseline;justify-content:center;gap:7px;
    font-family:var(--serif);font-weight:400;
    font-size:clamp(56px,8.2vw,96px);line-height:1;letter-spacing:-.015em;color:#fdf4e8;
    font-variant-numeric:tabular-nums;
    text-shadow:0 6px 34px rgba(0,0,0,.7),0 0 60px rgba(255,170,96,.16)}
  .clock .sec{font-size:.3em;color:#f0b072;letter-spacing:.03em;transform:translateY(-.58em);opacity:.92}
  .clock .colon{opacity:.45;animation:blink 5s steps(1,end) infinite}
  @keyframes blink{0%,93%{opacity:.45}97%{opacity:.16}}
  .date{font-size:clamp(12px,1.25vw,14.5px);letter-spacing:.22em;color:#d9c6b0;text-shadow:0 2px 14px rgba(0,0,0,.7)}

  .deck{width:min(1040px,100%);min-width:0;
    margin-left:auto;margin-right:auto;
    margin-top:max(18px, calc(56vh - 188px));
    display:grid;grid-template-columns:1.1fr .9fr;gap:16px;align-items:stretch}
  .card{position:relative;min-width:0;border-radius:22px;padding:19px 20px;
    background:linear-gradient(158deg, rgba(62,40,26,.70), rgba(27,17,11,.86));
    border:1px solid var(--line);
    box-shadow:0 28px 48px -28px rgba(0,0,0,.95), inset 0 1px 0 rgba(255,222,182,.11);
    backdrop-filter:blur(15px) saturate(118%)}
  .card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:radial-gradient(80% 100% at 0% 0%, rgba(255,190,120,.10), transparent 58%)}
  .card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px}
  .card-h h2{margin:0;font-family:var(--serif);font-weight:400;font-size:15px;letter-spacing:.07em;color:#f8ead8}

  .seg{display:inline-flex;gap:3px;padding:3px;border-radius:12px;
    background:rgba(0,0,0,.34);border:1px solid rgba(255,200,150,.1);margin-bottom:12px}
  .seg-btn{appearance:none;border:0;background:transparent;color:#ccb29a;cursor:pointer;
    font-family:var(--sans);font-size:12.5px;font-weight:600;padding:7px 15px;border-radius:9px;
    transition:color .2s,background .25s,box-shadow .25s}
  .seg-btn:hover{color:#f5e3ce}
  .seg-btn.active{color:#2a1608;background:linear-gradient(180deg,#f2bd80,#cf8b46);
    box-shadow:0 6px 14px -8px rgba(242,178,115,.95), inset 0 1px 0 rgba(255,255,255,.35)}
  .search-form{display:flex;align-items:center;gap:8px;
    background:rgba(8,5,3,.44);border:1px solid rgba(255,205,155,.17);border-radius:15px;
    padding:5px 5px 5px 14px;transition:border-color .25s,box-shadow .25s,background .25s}
  .search-form:focus-within{border-color:rgba(242,178,115,.62);box-shadow:0 0 0 3px rgba(242,178,115,.13);background:rgba(8,5,3,.58)}
  .search-form svg{width:17px;height:17px;flex:none;opacity:.5}
  .search-form input{flex:1;min-width:0;background:none;border:0;outline:none;
    font-family:var(--sans);font-size:14.5px;color:#fdf3e6;padding:10px 0}
  .search-form input::placeholder{color:rgba(230,206,180,.42)}
  .search-form input::-webkit-search-cancel-button{-webkit-appearance:none}
  .go{appearance:none;border:0;cursor:pointer;flex:none;display:inline-flex;align-items:center;gap:6px;
    padding:9px 14px;border-radius:11px;
    background:linear-gradient(180deg,#f2bd80,#c9823f);color:#2a1608;
    font-family:var(--sans);font-weight:700;font-size:12.5px;
    box-shadow:0 8px 18px -10px rgba(242,178,115,.95), inset 0 1px 0 rgba(255,255,255,.35);
    transition:transform .15s,filter .2s}
  .go:hover{filter:brightness(1.07)}
  .go:active{transform:translateY(1px)}
  .go .k{font-weight:600;opacity:.6;font-size:11px}

  .shortcuts{margin-top:15px}
  .shortcuts .lbl{font-size:10.5px;letter-spacing:.18em;color:rgba(216,190,164,.55);margin-bottom:8px}
  .chips{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
  .chip{display:flex;flex-direction:column;align-items:center;gap:6px;
    padding:10px 4px 9px;border-radius:14px;text-decoration:none;
    background:rgba(255,225,190,.055);border:1px solid rgba(255,214,170,.12);
    color:#f1e0cb;font-size:11px;letter-spacing:.01em;
    transition:transform .2s,background .25s,border-color .25s,box-shadow .25s}
  .chip:hover{background:rgba(255,196,130,.15);border-color:rgba(255,196,130,.42);transform:translateY(-3px);
    box-shadow:0 14px 22px -16px rgba(0,0,0,.95)}
  .chip:active{transform:translateY(-1px)}
  .chip .ico{width:22px;height:22px;display:grid;place-items:center;border-radius:8px;background:rgba(0,0,0,.32)}
  .chip .ico svg{width:15px;height:15px}
  .chip[data-brand="youtube"] .ico{color:#ff6b6b}
  .chip[data-brand="prime"] .ico{color:#6fbcff}
  .chip[data-brand="amazon"] .ico{color:#ffb454}
  .chip[data-brand="github"] .ico{color:#eae0d4}
  .chip[data-brand="opgg"] .ico{color:#e79a4a}

  .tip{margin:11px 0 0;font-size:10.5px;letter-spacing:.04em;color:rgba(220,196,168,.5)}
  .tip kbd{font-family:var(--sans);font-size:10px;padding:1px 5px;border-radius:4px;
    border:1px solid rgba(255,210,168,.22);background:rgba(0,0,0,.28);color:rgba(240,220,198,.7)}
  .memo-card{display:flex;flex-direction:column}
  .memo-card .status{font-size:10.5px;letter-spacing:.06em;color:rgba(220,196,168,.55);
    display:inline-flex;align-items:center;gap:6px;transition:color .3s}
  .memo-card .status .led{width:5px;height:5px;border-radius:50%;background:#8f7a63;transition:background .3s,box-shadow .3s}
  .memo-card .status.saved .led{background:#9ed08a;box-shadow:0 0 8px rgba(158,208,138,.75)}
  #memo{flex:1;width:100%;min-height:152px;resize:none;
    background:
      repeating-linear-gradient(180deg, transparent 0 27px, rgba(255,220,180,.07) 27px 28px) 0 6px,
      rgba(8,5,3,.36);
    border:1px solid rgba(255,205,155,.15);border-radius:14px;
    padding:12px 14px;color:#f9eddd;
    font-family:var(--sans);font-size:13.5px;line-height:28px;
    outline:none;transition:border-color .25s,box-shadow .25s;background-attachment:local}
  #memo::placeholder{color:rgba(226,201,175,.38)}
  #memo:focus{border-color:rgba(242,178,115,.58);box-shadow:0 0 0 3px rgba(242,178,115,.12)}
  .memo-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;min-height:20px}
  .memo-foot .count{font-size:10.5px;letter-spacing:.05em;color:rgba(216,190,164,.45)}
  .clear-btn{appearance:none;background:none;border:0;cursor:pointer;
    font-family:var(--sans);font-size:11px;letter-spacing:.06em;color:rgba(230,196,164,.55);
    padding:4px 6px;border-radius:7px;transition:color .2s,background .2s}
  .clear-btn:hover{color:#f2b273;background:rgba(242,178,115,.1)}
  .clear-btn.arming{color:#ffb4a2}

  .foot{width:min(1040px,100%);margin:14px auto 0;text-align:center;
    font-size:10.5px;letter-spacing:.05em;color:rgba(220,196,170,.55);line-height:1.7}
  .foot b{color:rgba(242,196,150,.68);font-weight:500}

  .grain{position:fixed;inset:0;z-index:40;pointer-events:none;opacity:.05;mix-blend-mode:overlay;

        b4 = 0.55000 * b4 + white * 0.5329522;
        b5 = -0.7616 * b5 - white * 0.0168980;
        var pink = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
        b6 = white * 0.115926;
        data[i] = pink * 0.075;
      }
    }
    return buf;
  }
  function buildRain() {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    if (!audio.ctx) {
      var ac = new AC();
      audio.ctx = ac;
      audio.buf = makePinkNoise(ac);
      audio.master = ac.createGain();
      audio.master.gain.value = 0;
      audio.master.connect(ac.destination);

      var src = ac.createBufferSource();
      src.buffer = audio.buf; src.loop = true;
      var hp = ac.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 220; hp.Q.value = 0.4;
      var lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 1500; lp.Q.value = 0.6;
      var body = ac.createGain(); body.gain.value = 0.85;
      src.connect(hp); hp.connect(lp); lp.connect(body); body.connect(audio.master);

      var src2 = ac.createBufferSource();
      src2.buffer = audio.buf; src2.loop = true; src2.playbackRate.value = 1.13;
      var bp = ac.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 2900; bp.Q.value = 0.5;
      var hiss = ac.createGain(); hiss.gain.value = 0.16;
      src2.connect(bp); bp.connect(hiss); hiss.connect(audio.master);

      var lfo = ac.createOscillator(); lfo.type = "sine"; lfo.frequency.value = 0.06;
      var lfoGain = ac.createGain(); lfoGain.gain.value = 0.045;
      lfo.connect(lfoGain); lfoGain.connect(audio.master.gain);
      lfo.start();
      src.start(); src2.start();
      audio.nodes = [src, src2, lfo];
    }
    return true;
  }
  function drip() {
    var ac = audio.ctx;
    if (!ac || !audio.playing) return;
    var t0 = ac.currentTime + 0.02;
    var len = Math.floor(ac.sampleRate * 0.09);
    var buf = ac.createBuffer(1, len, ac.sampleRate);
    var data = buf.getChannelData(0);
    for (var i = 0; i < len; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.2);
    }
    var s = ac.createBufferSource(); s.buffer = buf;
    var f = ac.createBiquadFilter();
    f.type = "bandpass";
    f.frequency.value = 1100 + Math.random() * 2300;
    f.Q.value = 3.5 + Math.random() * 4;
    var g = ac.createGain(); g.gain.value = 0.05 + Math.random() * 0.06;
    s.connect(f); f.connect(g); g.connect(audio.master);
    s.start(t0); s.stop(t0 + 0.12);
    audio.timer = window.setTimeout(drip, 1400 + Math.random() * 3200);
  }
  function setSound(on) {
    soundBtn.setAttribute("aria-pressed", on ? "true" : "false");
    soundLabel.textContent = on ? "빗소리 켜짐" : "빗소리";
    soundBtn.setAttribute("aria-label", on ? "빗소리 끄기" : "빗소리 켜기");
    audio.playing = on;
    var ac = audio.ctx;
    if (!ac || !audio.master) return;
    var now = ac.currentTime;
    audio.master.gain.cancelScheduledValues(now);
    audio.master.gain.setValueAtTime(Math.max(0.0001, audio.master.gain.value), now);
    if (on) audio.master.gain.linearRampToValueAtTime(0.17, now + 0.9);
    else audio.master.gain.linearRampToValueAtTime(0.0001, now + 0.7);
  }
  soundBtn.addEventListener("click", function () {
    if (audio.playing) {
      setSound(false);
      window.clearTimeout(audio.timer);
      return;
    }
    if (!buildRain()) { soundLabel.textContent = "소리 지원 안 됨"; return; }
    var ac = audio.ctx;
    var go = function () {
      setSound(true);
      window.clearTimeout(audio.timer);
      audio.timer = window.setTimeout(drip, 900);
    };
    if (ac.state === "suspended") ac.resume().then(go).catch(function () { setSound(true); });
    else go();
  });
  document.addEventListener("visibilitychange", function () {
    if (!audio.ctx) return;
    if (document.hidden && audio.playing) audio.ctx.suspend().catch(function () {});
    else if (!document.hidden && audio.playing) audio.ctx.resume().catch(function () {});
  });
})();
</script>
